[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reubeninstitute-css"
version = "0.5"
description = "Common CSS and design system for Reuben Institute projects"
readme = { text = "Shared stylesheets and design utilities for Reuben Institute web applications and viewers.", content-type = "text/plain" }
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["reubeninstitute"]

[tool.setuptools.package-dir]
reubeninstitute = "."

[tool.setuptools.package-data]
reubeninstitute = ["styles.css"]
